name: Auto Update Aggregator Lists

on:
  schedule:
    # Menjalankan script setiap hari pada jam 02:00 UTC (09:00 WIB)
    - cron: '0 2 * * *'
  workflow_dispatch: # Mengizinkan eksekusi manual via tombol di GitHub

permissions:
  contents: write

jobs:
  update-lists:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Git Buffer
        run: |
          git config --global http.postBuffer 524288000
          git config --global http.version HTTP/1.1

      - name: Scrape & Parse All Blocklists (Super Aggregator)
        run: |
          python update_lists.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add *.txt update_lists.py
          
          if ! git diff --staged --quiet; then
            echo "Memproses commit dan push..."
            git commit -m "🤖 Auto-update blocklists: $(date +'%Y-%m-%d')"
            git push origin main
            echo "✅ Perubahan berhasil disimpan ke GitHub!"
          else
            echo "🤷‍♂️ Daftar tidak ada perubahan hari ini. Melewati proses Push."
          fi
